<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>

:root{
  --bg1:#B8B8B8;
  --bg2:#BEBEBE;
  --bg3:#B0B0B0;
  --bg4:#C4C4C4;
  --paper:#D6D6D6;
  --paper-edge:#9A9A9A;
  --ink:#000000;
  --porcelain:#FFFFFF;
  --porcelain-dim:#CFCFCF;
  --hot:#8C8C8C;
  --hot-dim:#5A5A5A;
  --brass-dim:#5A5A5A;
  --cyan:#FFFFFF;
  --lime:#E4E4E4;
  --line:#000000;
  --rust:#2B2B2B;
  --navy1:#000000;
  --navy2:#4D4D4D;
  --raise-lo:#404040;
  --raise-hi:#FFFFFF;
  --panel:#C0C0C0;
}

*{box-sizing:border-box;}

html{cursor:default;}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--ink);
  text-shadow:1px 1px 1px rgba(0,0,0,.45);
  background:
    repeating-linear-gradient(135deg, var(--bg1) 0px, var(--bg1) 2px, var(--bg2) 2px, var(--bg2) 4px),
    var(--panel);
  background-attachment:fixed;
}

/* ── marquee ticker ── */
.marquee-bar{
  background:#000;
  border-bottom:3px solid #fff;
  overflow:hidden;
  white-space:nowrap;
  padding:7px 0;
}
.marquee-track{
  display:inline-block;
  padding-left:100%;
  animation:marquee-scroll 16s linear infinite;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:16px;
  letter-spacing:.03em;
  color:#fff;
  text-shadow:1px 1px 1px rgba(255,255,255,.25);
}
@keyframes marquee-scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

.wrap{
  max-width:960px;
  margin:0 auto;
  padding:44px 24px 60px;
}

.eyebrow{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#000;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
  margin:0 0 6px;
}

h1.title{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:clamp(32px,6vw,50px);
  margin:0 0 10px;
  line-height:1.05;
  color:#1a1a1a;
  text-shadow:2px 2px 2px rgba(0,0,0,.5);
}
.sparkle{
  display:inline-block;
  filter:grayscale(1) contrast(1.2);
  animation:spin-sparkle 3.5s linear infinite;
}
@keyframes spin-sparkle{
  0%{transform:rotate(0deg) scale(1);}
  50%{transform:rotate(180deg) scale(1.2);}
  100%{transform:rotate(360deg) scale(1);}
}

.subtitle{
  color:#fff;
  background:rgba(0,0,0,.4);
  display:inline-block;
  padding:6px 14px;
  font-size:14px;
  max-width:560px;
  line-height:1.5;
  margin:0;
  border:2px solid #fff;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}

.subtitle[contenteditable="true"], h1.title[contenteditable="true"]{
  outline:2px dashed #000;
  outline-offset:6px;
}

.masthead{
  margin-bottom:26px;
}

.nav{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:34px;
  padding:10px;
  background:rgba(0,0,0,.15);
  border:2px solid #000;
}
.nav-tab{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:13px;
  color:#000;
  background:var(--panel);
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  padding:8px 16px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
}
.nav-tab:hover{background:#CACACA;}
.nav-tab.active{
  background:#AFAFAF;
  border-top:2px solid var(--raise-lo);
  border-left:2px solid var(--raise-lo);
  border-right:2px solid var(--raise-hi);
  border-bottom:2px solid var(--raise-hi);
}
.nav-add{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:13px;
  color:#000;
  background:var(--panel);
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  padding:8px 14px;
  cursor:pointer;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
}
.nav-add:hover{background:#CACACA;}
.nav-tab-wrap{
  display:flex;
  align-items:center;
  gap:4px;
}
.nav-tab-controls{
  display:flex;
  gap:4px;
}
.nav-mini{
  font-family:Arial, Helvetica, sans-serif;
  font-size:11px;
  color:#fff;
  background:#000;
  border:1px solid #fff;
  cursor:pointer;
  padding:3px 7px;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}
.nav-mini:hover{background:#333;}
.nav-mini.danger:hover{background:#000;text-decoration:underline;}

.top-row{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  gap:24px;
  margin-bottom:30px;
}

.add-btn{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:14px;
  background:var(--panel);
  color:#000;
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  padding:11px 20px;
  cursor:pointer;
  white-space:nowrap;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
}
.add-btn:hover{background:#CACACA;}
.add-btn:active{
  border-top:2px solid var(--raise-lo);
  border-left:2px solid var(--raise-lo);
  border-right:2px solid var(--raise-hi);
  border-bottom:2px solid var(--raise-hi);
}
.add-btn:disabled{opacity:.5;cursor:default;}

.plates{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:30px;
}

.plate{
  display:flex;
  flex-direction:column;
  position:relative;
}

.new-ribbon{
  position:absolute;
  top:-8px;
  right:-8px;
  z-index:3;
  background:#000;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:12px;
  padding:5px 10px;
  border:1px solid #fff;
  animation:new-blink 1s steps(2, jump-none) infinite;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}
@keyframes new-blink{
  0%, 49%{opacity:1;}
  50%, 100%{opacity:.35;}
}

.figure{
  border:4px solid #000;
  padding:8px;
  background:#fff;
  box-shadow:5px 5px 0 rgba(0,0,0,.55);
}
.figure img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:4/5;
  object-fit:cover;
  cursor:zoom-in;
}
.figure .broken{
  width:100%;
  aspect-ratio:4/5;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  font-family:Arial, Helvetica, sans-serif;
  font-size:13px;
  text-align:center;
  padding:16px;
  background:repeating-linear-gradient(45deg,#000,#000 10px,#999 10px,#999 20px);
}

.caption-tab{
  background:var(--paper);
  color:var(--ink);
  border:3px solid #000;
  border-top:none;
  box-shadow:5px 5px 0 rgba(0,0,0,.3);
}
.caption-tab summary{
  cursor:pointer;
  list-style:none;
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.caption-tab summary::-webkit-details-marker{display:none;}
.caption-tab summary::after{
  content:"+";
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  color:#000;
  flex-shrink:0;
  font-size:15px;
  line-height:1.2;
}
.caption-tab[open] summary::after{content:"–";}
.summary-text{min-width:0;}

.plate-num{
  display:inline-block;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:11px;
  letter-spacing:.05em;
  color:#fff;
  background:#000;
  padding:2px 7px;
  margin-bottom:5px;
  text-shadow:none;
}

.caption-tab h2{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:15px;
  margin:0;
  line-height:1.25;
  text-shadow:1px 1px 1px rgba(0,0,0,.25);
}

.caption-body{
  padding:0 12px 16px;
}
.caption-body p{
  font-size:13.5px;
  line-height:1.6;
  margin:0 0 10px;
  color:#1a1a1a;
  white-space:pre-wrap;
  text-shadow:none;
}

.plate-date{
  font-family:Arial, Helvetica, sans-serif;
  font-size:11px;
  color:#3d3d3d;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dotted var(--paper-edge);
}

.plate-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.icon-btn{
  font-family:Arial, Helvetica, sans-serif;
  font-size:11px;
  font-weight:bold;
  background:var(--panel);
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  color:#000;
  padding:5px 10px;
  cursor:pointer;
  text-shadow:none;
}
.icon-btn:hover{background:#CACACA;}
.icon-btn.danger{background:#3a3a3a;color:#fff;}
.icon-btn.danger:hover{background:#000;}

.empty{
  border:3px dashed #000;
  padding:60px 30px;
  text-align:center;
  color:#fff;
  background:rgba(0,0,0,.3);
}
.empty .eyebrow{margin-bottom:14px;color:#fff;text-shadow:1px 1px 1px rgba(0,0,0,.6);}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.6;}

.owner-bar{
  position:fixed;
  bottom:22px;
  right:22px;
  z-index:50;
  display:flex;
  gap:10px;
  align-items:center;
}
.owner-btn{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:13px;
  background:var(--panel);
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  color:#000;
  padding:10px 16px;
  cursor:pointer;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
}
.owner-btn.active{background:#AFAFAF;}
.owner-btn:hover{background:#CACACA;}
.owner-btn.small{font-size:11px;padding:8px 12px;}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  padding:20px;
  overflow-y:auto;
}
.modal{
  position:relative;
  background:var(--panel);
  color:var(--ink);
  width:100%;
  max-width:460px;
  padding:48px 26px 26px;
  border:2px solid #000;
  margin:auto;
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
}
.modal::before{
  content:"GALLERY.EXE";
  position:absolute;
  top:0;left:0;right:0;
  height:34px;
  background:linear-gradient(90deg, var(--navy1), var(--navy2));
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:14px;
  display:flex;
  align-items:center;
  padding-left:12px;
  letter-spacing:.03em;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}
.modal::after{
  content:"✕";
  position:absolute;
  top:6px;right:8px;
  width:22px;height:22px;
  background:var(--panel);
  border:2px solid #000;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial, Helvetica, sans-serif;font-size:12px;color:#000;
}
.modal h3{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:20px;
  margin:0 0 6px;
  text-shadow:1px 1px 1px rgba(0,0,0,.3);
}
.modal .hint{
  font-size:13px;
  color:#1a1a1a;
  margin:0 0 20px;
  line-height:1.55;
  text-shadow:none;
}
.modal .hint code{
  background:#e6e6e6;
  padding:1px 5px;
  font-family:Arial, Helvetica, sans-serif;
  font-size:12px;
  border:1px solid #000;
}
.modal ol.setup-steps{
  font-size:13px;
  color:#1a1a1a;
  line-height:1.6;
  margin:0 0 20px;
  padding-left:20px;
  text-shadow:none;
}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#1a1a1a;
  margin-bottom:5px;
  text-shadow:none;
}
.field input, .field textarea{
  width:100%;
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
  padding:9px 11px;
  border-top:2px solid var(--raise-lo);
  border-left:2px solid var(--raise-lo);
  border-right:2px solid var(--raise-hi);
  border-bottom:2px solid var(--raise-hi);
  background:#fff;
  color:var(--ink);
  text-shadow:none;
}
.field input[type="file"]{padding:8px;}
.field textarea{resize:vertical;min-height:90px;font-family:inherit;}
.field input:focus, .field textarea:focus{outline:none;border-color:#000;}
.file-preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border:2px solid #000;
  margin-top:10px;
  background:#fff;
  display:block;
}
.current-label{
  font-family:Arial, Helvetica, sans-serif;
  font-size:11px;
  color:#1a1a1a;
  margin-top:6px;
  text-shadow:none;
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
  flex-wrap:wrap;
}
.btn{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:13px;
  padding:9px 18px;
  cursor:pointer;
  background:var(--panel);
  color:#000;
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
}
.btn.primary{background:#AFAFAF;}
.btn:hover{background:#CACACA;}
.btn:active{
  border-top:2px solid var(--raise-lo);
  border-left:2px solid var(--raise-lo);
  border-right:2px solid var(--raise-hi);
  border-bottom:2px solid var(--raise-hi);
}
.btn:disabled{opacity:.5;cursor:default;}
.modal-error{
  color:#000;
  font-weight:bold;
  font-size:12.5px;
  margin:-8px 0 16px;
  text-shadow:none;
}
.modal-note{
  font-size:12.5px;
  color:#1a1a1a;
  font-weight:bold;
  margin:-8px 0 16px;
  text-shadow:none;
}

.loading{
  padding:80px 0;
  text-align:center;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:16px;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-shadow:2px 2px 2px rgba(0,0,0,.6);
}

.figure img{cursor:zoom-in;}

.lightbox-overlay{
  position:fixed;inset:0;
  background:#000;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 100px;
}
.lightbox-overlay::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%, #fff 1px, transparent 1.5px) 0 0/50px 50px,
    radial-gradient(circle at 70% 70%, #fff 1px, transparent 1.5px) 15px 15px/70px 70px;
  opacity:.35;
  animation:twinkle 2.4s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes twinkle{0%{opacity:.15;}100%{opacity:.5;}}
.lightbox-close{
  position:fixed;
  top:20px;
  right:24px;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:14px;
  background:#000;
  border:2px solid #fff;
  color:#fff;
  padding:8px 16px;
  cursor:pointer;
  z-index:310;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}
.lightbox-close:hover{background:#fff;color:#000;text-shadow:none;}
.lightbox-arrow{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  background:var(--panel);
  border-top:2px solid var(--raise-hi);
  border-left:2px solid var(--raise-hi);
  border-right:2px solid var(--raise-lo);
  border-bottom:2px solid var(--raise-lo);
  color:#000;
  font-size:20px;
  line-height:1;
  cursor:pointer;
  z-index:310;
  display:flex;
  align-items:center;
  justify-content:center;
  text-shadow:none;
}
.lightbox-arrow:hover{background:#CACACA;}
.lightbox-arrow:disabled{opacity:.2;cursor:default;}
.lightbox-arrow:disabled:hover{background:var(--panel);}
.lightbox-arrow.left{left:24px;}
.lightbox-arrow.right{right:24px;}
.lightbox-body{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  max-width:100%;
  max-height:100%;
  z-index:2;
}
.lightbox-img{
  max-width:100%;
  max-height:70vh;
  object-fit:contain;
  border:4px solid #fff;
  background:#111;
}
.lightbox-caption{
  text-align:center;
  margin-top:20px;
  max-width:600px;
}
.lightbox-caption .plate-num{margin-bottom:8px;}
.lightbox-caption h2{
  font-family:Arial, Helvetica, sans-serif;
  font-weight:bold;
  font-size:20px;
  margin:0 0 8px;
  color:#fff;
  text-shadow:2px 2px 2px rgba(0,0,0,.6);
}
.lightbox-caption p{
  font-size:14px;
  line-height:1.6;
  color:var(--porcelain-dim);
  margin:0;
  white-space:pre-wrap;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
}

/* ── retro footer ── */
.y2k-footer{
  margin-top:60px;
  padding-bottom:40px;
}
.caution-strip{
  height:20px;
  background:repeating-linear-gradient(45deg,#000,#000 14px,#999 14px,#999 28px);
  border-top:2px solid #000;
  border-bottom:2px solid #000;
}
.footer-panel{
  max-width:960px;
  margin:0 auto;
  padding:22px 24px 10px;
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  align-items:center;
  justify-content:center;
  font-family:Arial, Helvetica, sans-serif;
}
.footer-badge{
  background:#000;
  color:#fff;
  border:1px solid #fff;
  padding:7px 14px;
  font-size:13px;
  font-weight:bold;
  letter-spacing:.02em;
  text-shadow:1px 1px 1px rgba(0,0,0,.6);
  filter:grayscale(1);
}
.footer-badge.counter{color:#fff;border-color:#fff;}
.footer-note{
  color:#000;
  text-shadow:1px 1px 1px rgba(255,255,255,.5);
  font-size:14px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

@media (max-width:900px){
  .plates{grid-template-columns:repeat(2, 1fr);}
}
@media (max-width:560px){
  .plates{grid-template-columns:1fr;}
  .lightbox-overlay{padding:70px 20px;}
  .lightbox-arrow{width:44px;height:44px;font-size:17px;}
  .lightbox-arrow.left{left:8px;}
  .lightbox-arrow.right{right:8px;}
}
</style>
</head>
<body>

<div class="marquee-bar">
  <div class="marquee-track">☆ ★ WELCOME TO MY GALLERY ★ ☆ &nbsp;&nbsp; BEST VIEWED AT 800x600 RESOLUTION &nbsp;&nbsp; ☆ ★ SIGN MY GUESTBOOK ★ ☆ &nbsp;&nbsp; THANKS FOR STOPPING BY!! &nbsp;&nbsp; ☆ ★ WELCOME TO MY GALLERY ★ ☆</div>
</div>

<div class="wrap" id="app">
  <div class="loading">Opening the gallery…</div>
</div>

<div class="y2k-footer">
  <div class="caution-strip"></div>
  <div class="footer-panel">
    <div class="footer-note">✦ Best viewed in Netscape Navigator 4.0 or Internet Explorer 5 ✦</div>
    <div class="footer-badge counter">VISITORS: 001337</div>
    <div class="footer-badge">🚧 SITE UNDER CONSTRUCTION 🚧</div>
  </div>
</div>

<div class="owner-bar" id="ownerBar"></div>
<div id="modalRoot"></div>
<div id="lightboxRoot"></div>

<script>
/* Edit these two lines to match your GitHub repo before uploading */
const GH_OWNER  = "KrishnaTejaPeddi";
const GH_REPO   = "KrishnaPeddiGallery";
const GH_BRANCH = "main";
const DATA_PATH = "data.json";
const TOKEN_KEY = "gallery-gh-token";
const MAX_IMAGE_BYTES = 25 * 1024 * 1024;

let meta = { title: "Field Notes", subtitle: "A running collection of images, and the small stories behind each one." };
let pages = [
  { id: "home", label: "Home" },
  { id: "photography", label: "Photography" }
];
let postsByPage = { home: [], photography: [] };
let isOwner = false;
let pendingFile = null;
let lightboxState = null;

function openLightbox(pageId, index){
  lightboxState = { pageId, index };
  renderLightbox();
  document.addEventListener("keydown", lightboxKeyHandler);
}
function closeLightbox(){
  lightboxState = null;
  document.getElementById("lightboxRoot").innerHTML = "";
  document.removeEventListener("keydown", lightboxKeyHandler);
}
function lightboxNav(dir){
  if(!lightboxState) return;
  const posts = postsByPage[lightboxState.pageId] || [];
  const newIndex = lightboxState.index + dir;
  if(newIndex < 0 || newIndex >= posts.length) return;
  lightboxState.index = newIndex;
  renderLightbox();
}
function lightboxKeyHandler(e){
  if(e.key === "Escape") closeLightbox();
  else if(e.key === "ArrowLeft") lightboxNav(-1);
  else if(e.key === "ArrowRight") lightboxNav(1);
}
function renderLightbox(){
  const root = document.getElementById("lightboxRoot");
  if(!lightboxState){ root.innerHTML = ""; return; }
  const posts = postsByPage[lightboxState.pageId] || [];
  const post = posts[lightboxState.index];
  if(!post){ closeLightbox(); return; }
  const atStart = lightboxState.index === 0;
  const atEnd = lightboxState.index === posts.length - 1;

  root.innerHTML = ""
    + '<div class="lightbox-overlay" id="lbOverlay">'
    + '<button class="lightbox-close" onclick="closeLightbox()">Close ✕</button>'
    + '<button class="lightbox-arrow left" onclick="lightboxNav(-1)"' + (atStart ? " disabled" : "") + '>&#8592;</button>'
    + '<button class="lightbox-arrow right" onclick="lightboxNav(1)"' + (atEnd ? " disabled" : "") + '>&#8594;</button>'
    + '<div class="lightbox-body">'
    + '<img class="lightbox-img" src="' + esc(post.imageUrl) + '" alt="' + esc(post.title) + '" onerror="retryImage(this)">'
    + '<div class="lightbox-caption">'
    + '<div class="plate-num" style="color:var(--brass-dim)">Plate ' + pad3(lightboxState.index + 1) + " of " + pad3(posts.length) + "</div>"
    + "<h2>" + (esc(post.title) || "Untitled") + "</h2>"
    + "<p>" + esc(post.caption) + "</p>"
    + "</div></div></div>";

  document.getElementById("lbOverlay").addEventListener("click", (e) => {
    if(e.target.id === "lbOverlay") closeLightbox();
  });
}

function esc(s){
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}
function pad3(n){ return String(n).padStart(3, "0"); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ""; }
function slugify(label){
  let base = label.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  if(!base) base = "page";
  let id = base;
  let n = 2;
  while(pages.some(p => p.id === id)){ id = base + "-" + n; n++; }
  return id;
}
function currentPageId(){
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(hash && pages.some(p => p.id === hash)) return hash;
  return pages[0] ? pages[0].id : "home";
}
function applyData(json){
  if(json.meta) meta = json.meta;
  if(json.pages && json.pages.length) pages = json.pages;
  if(json.postsByPage) postsByPage = json.postsByPage;
  else if(json.posts) postsByPage = { home: json.posts };
  pages.forEach(p => { if(!postsByPage[p.id]) postsByPage[p.id] = []; });
}
function readFileAsBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}
function safeFileName(name){
  const parts = name.split(".");
  const ext = parts.length > 1 ? parts.pop().toLowerCase().replace(/[^a-z0-9]/g, "") : "jpg";
  return "img-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "." + (ext || "jpg");
}
function rawUrlFor(path){
  return "https://raw.githubusercontent.com/" + GH_OWNER + "/" + GH_REPO + "/" + GH_BRANCH + "/" + path.split("/").map(encodeURIComponent).join("/");
}
function retryImage(img){
  const attempt = parseInt(img.dataset.retry || "0", 10) + 1;
  if(attempt > 4){
    img.replaceWith(Object.assign(document.createElement("div"), { className: "broken", textContent: "Image could not be loaded" }));
    return;
  }
  const baseSrc = img.dataset.baseSrc || img.src.split("?")[0];
  img.dataset.baseSrc = baseSrc;
  img.dataset.retry = attempt;
  setTimeout(() => { img.src = baseSrc + "?r=" + Date.now(); }, attempt * 1500);
}

async function loadPublicData(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/" + GH_OWNER + "/" + GH_REPO + "/" + GH_BRANCH + "/" + DATA_PATH + "?t=" + Date.now());
    if(res.ok) applyData(await res.json());
  }catch(e){}
}

async function loadFreshViaApi(token){
  const res = await fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + DATA_PATH + "?ref=" + GH_BRANCH, {
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }
  });
  if(res.status === 404) return;
  if(!res.ok) throw new Error("Could not reach the repository.");
  const json = await res.json();
  applyData(JSON.parse(b64DecodeUtf8(json.content)));
}

async function getDataSha(token){
  const res = await fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + DATA_PATH + "?ref=" + GH_BRANCH, {
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }
  });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error("Could not reach the repository.");
  const json = await res.json();
  return json.sha;
}

async function commitData(message){
  const token = getToken();
  const sha = await getDataSha(token);
  const body = {
    message,
    content: b64EncodeUtf8(JSON.stringify({ meta, pages, postsByPage }, null, 2)),
    branch: GH_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + DATA_PATH, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.message || "Save failed.");
  }
}

async function ghApi(path, token, options){
  const res = await fetch("https://api.github.com" + path, Object.assign({
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }
  }, options));
  if(!res.ok){
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.message || "GitHub request failed.");
  }
  return res.json();
}

async function commitImageAndData(file, message){
  const token = getToken();
  const base64 = await readFileAsBase64(file);
  const imagePath = "images/" + safeFileName(file.name);

  const refJson = await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/refs/heads/" + GH_BRANCH, token);
  const latestCommitSha = refJson.object.sha;

  const commitJson = await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/commits/" + latestCommitSha, token);
  const baseTreeSha = commitJson.tree.sha;

  const blobJson = await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/blobs", token, {
    method: "POST",
    body: JSON.stringify({ content: base64, encoding: "base64" })
  });

  const treeJson = await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/trees", token, {
    method: "POST",
    body: JSON.stringify({
      base_tree: baseTreeSha,
      tree: [
        { path: imagePath, mode: "100644", type: "blob", sha: blobJson.sha },
        { path: DATA_PATH, mode: "100644", type: "blob", content: JSON.stringify({ meta, pages, postsByPage }, null, 2) }
      ]
    })
  });

  const newCommitJson = await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/commits", token, {
    method: "POST",
    body: JSON.stringify({ message, tree: treeJson.sha, parents: [latestCommitSha] })
  });

  await ghApi("/repos/" + GH_OWNER + "/" + GH_REPO + "/git/refs/heads/" + GH_BRANCH, token, {
    method: "PATCH",
    body: JSON.stringify({ sha: newCommitJson.sha })
  });

  return rawUrlFor(imagePath);
}

function render(){
  const app = document.getElementById("app");
  const ownerBar = document.getElementById("ownerBar");
  const pageId = currentPageId();
  const posts = postsByPage[pageId] || [];

  const navHtml = pages.map(p => {
    const active = p.id === pageId;
    let controls = "";
    if(isOwner && active){
      controls = '<span class="nav-tab-controls">'
        + '<button class="nav-mini" title="Rename page" onclick="renamePage(\'' + p.id + '\')">Rename</button>';
      if(pages.length > 1){
        controls += '<button class="nav-mini danger" title="Delete page" onclick="deletePage(\'' + p.id + '\')">Delete</button>';
      }
      controls += "</span>";
    }
    return '<span class="nav-tab-wrap"><a class="nav-tab' + (active ? " active" : "") + '" href="#' + encodeURIComponent(p.id) + '">' + esc(p.label) + "</a>" + controls + "</span>";
  }).join("");

  let platesHtml = "";
  if(posts.length === 0){
    platesHtml = ""
      + '<div class="empty">'
      + '<div class="eyebrow">Empty wall</div>'
      + "<p>" + (isOwner ? "Nothing hung yet on this page. Add your first image to begin." : "No plates have been hung yet.") + "</p>"
      + (isOwner ? '<button class="add-btn" onclick="openPostModal()">+ Add image</button>' : "")
      + "</div>";
  }else{
    platesHtml = posts.map((post, i) => {
      const isNewest = i === posts.length - 1;
      return ""
        + '<div class="plate">'
        + (isNewest ? '<div class="new-ribbon">NEW!</div>' : "")
        + '<div class="figure">'
        + '<img src="' + esc(post.imageUrl) + '" alt="' + esc(post.title) + '" '
        + 'onclick="openLightbox(\'' + pageId + '\', ' + i + ')" '
        + 'onerror="retryImage(this)">'
        + "</div>"
        + '<details class="caption-tab">'
        + '<summary><div class="summary-text"><div class="plate-num">Plate ' + pad3(i + 1) + '</div><h2>' + (esc(post.title) || "Untitled") + "</h2></div></summary>"
        + '<div class="caption-body">'
        + "<p>" + esc(post.caption) + "</p>"
        + (post.date ? '<div class="plate-date">' + fmtDate(post.date) + "</div>" : "")
        + (isOwner
            ? '<div class="plate-actions">'
              + '<button class="icon-btn" onclick="openPostModal(\'' + post.id + '\')">Edit</button>'
              + '<button class="icon-btn danger" onclick="deletePost(\'' + post.id + '\')">Delete</button>'
              + "</div>"
            : "")
        + "</div></details></div>";
    }).join("");
  }

  app.innerHTML = ""
    + '<div class="masthead">'
    + '<div class="eyebrow">✦ Gallery ✦</div>'
    + '<h1 class="title" id="titleEl"' + (isOwner ? ' contenteditable="true"' : "") + '><span class="sparkle">✦</span> ' + esc(meta.title) + ' <span class="sparkle">✦</span></h1>'
    + '<p class="subtitle" id="subtitleEl"' + (isOwner ? ' contenteditable="true"' : "") + ">" + esc(meta.subtitle) + "</p>"
    + "</div>"
    + '<div class="nav">' + navHtml + (isOwner ? '<button class="nav-add" onclick="addPage()">+ Page</button>' : "") + "</div>"
    + '<div class="top-row">' + (isOwner ? '<button class="add-btn" onclick="openPostModal()">+ Add image</button>' : "") + "</div>"
    + '<div class="plates">' + platesHtml + "</div>";

  if(isOwner){
    const t = document.getElementById("titleEl");
    const s = document.getElementById("subtitleEl");
    t.addEventListener("blur", async () => {
      const newVal = t.textContent.trim() || "Field Notes";
      if(newVal !== meta.title){ meta.title = newVal; await commitData("Update gallery title"); }
    });
    s.addEventListener("blur", async () => {
      const newVal = s.textContent.trim();
      if(newVal !== meta.subtitle){ meta.subtitle = newVal; await commitData("Update gallery subtitle"); }
    });
  }

  ownerBar.innerHTML = isOwner
    ? '<button class="owner-btn small" onclick="disconnectOwner()">Disconnect</button><button class="owner-btn active" onclick="exitOwnerMode()">Editing · Done</button>'
    : '<button class="owner-btn" onclick="promptOwner()">Edit</button>';
}

window.addEventListener("hashchange", render);

function openModal(html){
  document.getElementById("modalRoot").innerHTML = '<div class="modal-overlay" id="ovl">' + html + "</div>";
  document.getElementById("ovl").addEventListener("click", (e) => { if(e.target.id === "ovl") closeModal(); });
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; pendingFile = null; }

async function promptOwner(){
  const saved = getToken();
  if(saved){
    openModal('<div class="modal"><h3>Connecting…</h3><p class="hint">Checking your saved access token.</p></div>');
    try{
      await loadFreshViaApi(saved);
      isOwner = true;
      closeModal();
      render();
    }catch(e){
      localStorage.removeItem(TOKEN_KEY);
      showConnectModal("Your saved token no longer works. Connect again below.");
    }
    return;
  }
  showConnectModal();
}

function showConnectModal(errorMsg){
  openModal(""
    + '<div class="modal">'
    + "<h3>Connect this device</h3>"
    + '<p class="hint">To edit, this browser needs a GitHub personal access token with write access to <code>' + esc(GH_OWNER) + "/" + esc(GH_REPO) + '</code>. It is stored only in this browser — visitors never see it.</p>'
    + '<ol class="setup-steps">'
    + "<li>On GitHub, go to Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>"
    + '<li>Under "Repository access", choose "Only select repositories" and pick this repo.</li>'
    + '<li>Under "Permissions" → "Repository permissions", set <b>Contents</b> to <b>Read and write</b>.</li>'
    + "<li>Generate the token and paste it below.</li>"
    + "</ol>"
    + (errorMsg ? '<div class="modal-error">' + esc(errorMsg) + "</div>" : "")
    + '<div id="err"></div>'
    + '<div class="field"><label>Personal access token</label><input type="password" id="fToken" placeholder="github_pat_…"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" onclick="connectToken()">Connect</button>'
    + "</div></div>");
}

async function connectToken(){
  const token = document.getElementById("fToken").value.trim();
  const err = document.getElementById("err");
  if(!token){ err.innerHTML = '<div class="modal-error">Paste a token first.</div>'; return; }
  err.innerHTML = '<div class="modal-note">Checking access…</div>';
  try{
    await loadFreshViaApi(token);
    localStorage.setItem(TOKEN_KEY, token);
    isOwner = true;
    closeModal();
    render();
  }catch(e){
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "That token could not access this repository.") + "</div>";
  }
}

function disconnectOwner(){
  localStorage.removeItem(TOKEN_KEY);
  isOwner = false;
  render();
}
function exitOwnerMode(){ isOwner = false; render(); }

function addPage(){
  openModal(""
    + '<div class="modal"><h3>Add a page</h3>'
    + '<p class="hint">Give it a name — it will appear as a tab in the nav bar.</p>'
    + '<div id="err"></div>'
    + '<div class="field"><label>Page name</label><input type="text" id="fPageLabel" placeholder="e.g. Photography"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" onclick="confirmAddPage()">Add page</button>'
    + "</div></div>");
}

async function confirmAddPage(){
  const label = document.getElementById("fPageLabel").value.trim();
  const err = document.getElementById("err");
  if(!label){ err.innerHTML = '<div class="modal-error">Name the page first.</div>'; return; }
  const id = slugify(label);
  const prevPages = JSON.parse(JSON.stringify(pages));
  const prevPosts = JSON.parse(JSON.stringify(postsByPage));
  pages.push({ id, label });
  postsByPage[id] = [];
  try{
    await commitData("Add page: " + label);
    closeModal();
    location.hash = "#" + encodeURIComponent(id);
    render();
  }catch(e){
    pages = prevPages;
    postsByPage = prevPosts;
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "Could not add the page.") + "</div>";
  }
}

function renamePage(id){
  const page = pages.find(p => p.id === id);
  openModal(""
    + '<div class="modal"><h3>Rename page</h3>'
    + '<div id="err"></div>'
    + '<div class="field"><label>Page name</label><input type="text" id="fPageLabel" value="' + esc(page.label) + '"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" onclick="confirmRenamePage(\'' + id + '\')">Save</button>'
    + "</div></div>");
}

async function confirmRenamePage(id){
  const label = document.getElementById("fPageLabel").value.trim();
  const err = document.getElementById("err");
  if(!label){ err.innerHTML = '<div class="modal-error">Name cannot be empty.</div>'; return; }
  const page = pages.find(p => p.id === id);
  const prevLabel = page.label;
  page.label = label;
  try{
    await commitData("Rename page to " + label);
    closeModal();
    render();
  }catch(e){
    page.label = prevLabel;
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "Could not rename the page.") + "</div>";
  }
}

function deletePage(id){
  const page = pages.find(p => p.id === id);
  openModal(""
    + '<div class="modal"><h3>Delete "' + esc(page.label) + '"?</h3>'
    + '<p class="hint">This removes the page and every image and caption on it, for everyone. This cannot be undone.</p>'
    + '<div id="err"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" style="background:var(--rust);border-color:var(--rust)" onclick="confirmDeletePage(\'' + id + '\')">Delete page</button>'
    + "</div></div>");
}

async function confirmDeletePage(id){
  const err = document.getElementById("err");
  const prevPages = JSON.parse(JSON.stringify(pages));
  const prevPosts = JSON.parse(JSON.stringify(postsByPage));
  pages = pages.filter(p => p.id !== id);
  delete postsByPage[id];
  try{
    await commitData("Delete page");
    closeModal();
    location.hash = "#" + encodeURIComponent(pages[0].id);
    render();
  }catch(e){
    pages = prevPages;
    postsByPage = prevPosts;
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "Could not delete the page.") + "</div>";
  }
}

function openPostModal(id){
  const pageId = currentPageId();
  const posts = postsByPage[pageId];
  const editing = !!id;
  const post = editing ? posts.find(p => p.id === id) : null;
  const today = new Date().toISOString().slice(0, 10);
  pendingFile = null;
  openModal(""
    + '<div class="modal">'
    + "<h3>" + (editing ? "Edit plate" : "Add image") + "</h3>"
    + '<p class="hint">Upload a photo from your computer, give it a title, and write the text you want beside it.</p>'
    + '<div id="err"></div>'
    + '<div class="field"><label>Photo</label><input type="file" id="fFile" accept="image/*" onchange="onFileChosen()">'
    + (editing && post.imageUrl ? '<div class="current-label">Current image shown below. Choose a new file only if you want to replace it.</div><img class="file-preview" id="filePreview" src="' + esc(post.imageUrl) + '">' : '<img class="file-preview" id="filePreview" style="display:none">')
    + "</div>"
    + '<div class="field"><label>Title</label><input type="text" id="fTitle" placeholder="Give it a title" value="' + (post ? esc(post.title) : "") + '"></div>'
    + '<div class="field"><label>Caption</label><textarea id="fCaption" placeholder="What is the story here?">' + (post ? esc(post.caption) : "") + "</textarea></div>"
    + '<div class="field"><label>Date</label><input type="date" id="fDate" value="' + (post ? esc(post.date || today) : today) + '"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" id="saveBtn" onclick="savePost(' + (editing ? "'" + id + "'" : "null") + ')">' + (editing ? "Save changes" : "Add to gallery") + "</button>"
    + "</div></div>");
}

function onFileChosen(){
  const input = document.getElementById("fFile");
  const preview = document.getElementById("filePreview");
  const err = document.getElementById("err");
  const file = input.files[0];
  if(!file) return;
  if(file.size > MAX_IMAGE_BYTES){
    err.innerHTML = '<div class="modal-error">That file is larger than 25MB. Choose a smaller one.</div>';
    input.value = "";
    return;
  }
  err.innerHTML = "";
  pendingFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

async function savePost(id){
  const pageId = currentPageId();
  const posts = postsByPage[pageId];
  const title = document.getElementById("fTitle").value.trim();
  const caption = document.getElementById("fCaption").value.trim();
  const date = document.getElementById("fDate").value;
  const err = document.getElementById("err");
  const saveBtn = document.getElementById("saveBtn");

  const existingPost = id ? posts.find(p => p.id === id) : null;
  if(!pendingFile && !(existingPost && existingPost.imageUrl)){
    err.innerHTML = '<div class="modal-error">Choose a photo to upload.</div>';
    return;
  }

  saveBtn.disabled = true;
  err.innerHTML = '<div class="modal-note">' + (pendingFile ? "Uploading photo…" : "Saving…") + "</div>";

  const prevPosts = JSON.parse(JSON.stringify(posts));
  let newPostId = id;
  try{
    let imageUrl = existingPost ? existingPost.imageUrl : null;

    if(id){
      const post = posts.find(p => p.id === id);
      post.title = title; post.caption = caption; post.date = date;
    }else{
      newPostId = "p" + Date.now() + Math.random().toString(36).slice(2, 7);
      posts.push({ id: newPostId, imageUrl: "", title, caption, date });
    }

    if(pendingFile){
      imageUrl = await commitImageAndData(pendingFile, id ? "Replace image on gallery plate" : "Add gallery plate with image");
      const post = posts.find(p => p.id === newPostId);
      post.imageUrl = imageUrl;
    }else{
      await commitData(id ? "Edit gallery plate" : "Add gallery plate");
    }

    closeModal();
    render();
  }catch(e){
    postsByPage[pageId] = prevPosts;
    saveBtn.disabled = false;
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "Save failed. Try again.") + "</div>";
  }
}

function deletePost(id){
  openModal(""
    + '<div class="modal"><h3>Delete this plate?</h3>'
    + '<p class="hint">This removes the image and text from the gallery for everyone. This cannot be undone.</p>'
    + '<div id="err"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" style="background:var(--rust);border-color:var(--rust)" onclick="confirmDelete(\'' + id + '\')">Delete</button>'
    + "</div></div>");
}

async function confirmDelete(id){
  const pageId = currentPageId();
  const posts = postsByPage[pageId];
  const err = document.getElementById("err");
  const prevPosts = JSON.parse(JSON.stringify(posts));
  postsByPage[pageId] = posts.filter(p => p.id !== id);
  try{
    await commitData("Delete gallery plate");
    closeModal();
    render();
  }catch(e){
    postsByPage[pageId] = prevPosts;
    err.innerHTML = '<div class="modal-error">' + esc(e.message || "Delete failed. Try again.") + "</div>";
  }
}

window.openPostModal = openPostModal;
window.onFileChosen = onFileChosen;
window.savePost = savePost;
window.deletePost = deletePost;
window.confirmDelete = confirmDelete;
window.promptOwner = promptOwner;
window.connectToken = connectToken;
window.disconnectOwner = disconnectOwner;
window.exitOwnerMode = exitOwnerMode;
window.closeModal = closeModal;
window.addPage = addPage;
window.confirmAddPage = confirmAddPage;
window.renamePage = renamePage;
window.confirmRenamePage = confirmRenamePage;
window.deletePage = deletePage;
window.confirmDeletePage = confirmDeletePage;
window.openLightbox = openLightbox;
window.closeLightbox = closeLightbox;
window.lightboxNav = lightboxNav;
window.retryImage = retryImage;

(async function init(){
  await loadPublicData();
  render();
})();
</script>
