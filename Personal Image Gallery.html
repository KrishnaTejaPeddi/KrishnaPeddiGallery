<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg: #15140F;
  --bg-raised: #1D1B15;
  --paper: #EFEAE0;
  --ink: #221F1A;
  --porcelain: #F2EEE3;
  --porcelain-dim: #A9A497;
  --brass: #B4934F;
  --brass-dim: #7C6A45;
  --line: #38352C;
  --rust: #A5533A;
  --moss: #5B7A63;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--porcelain);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:920px;
  margin:0 auto;
  padding:64px 28px 120px;
}

.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--brass);
  margin:0 0 10px;
}

h1.title{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(34px,5vw,54px);
  margin:0 0 8px;
  line-height:1.05;
  color:var(--porcelain);
}

.subtitle{
  color:var(--porcelain-dim);
  font-size:15px;
  max-width:520px;
  line-height:1.6;
  margin:0;
}

.subtitle[contenteditable="true"], h1.title[contenteditable="true"]{
  outline:1px dashed var(--brass-dim);
  outline-offset:6px;
  border-radius:2px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:24px;
  margin-bottom:56px;
  border-bottom:1px solid var(--line);
  padding-bottom:40px;
}

.add-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:transparent;
  color:var(--brass);
  border:1px solid var(--brass-dim);
  padding:11px 18px;
  border-radius:2px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease, color .15s ease;
}
.add-btn:hover{background:var(--brass);color:var(--ink);}

.plates{
  display:flex;
  flex-direction:column;
  gap:64px;
}

.plate{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  gap:36px;
  align-items:start;
}
.plate.rev{grid-template-columns:1fr 1.15fr;}
.plate.rev .figure{order:2;}
.plate.rev .caption{order:1;}

.figure{
  border:1px solid var(--line);
  padding:10px;
  background:var(--bg-raised);
}
.figure img{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  object-fit:cover;
  background:#0000;
}
.figure .broken{
  width:100%;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--porcelain-dim);
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  text-align:center;
  padding:20px;
}

.caption{
  background:var(--paper);
  color:var(--ink);
  padding:28px 26px;
  align-self:stretch;
  display:flex;
  flex-direction:column;
  min-height:180px;
}

.plate-num{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--brass-dim);
  margin-bottom:10px;
}

.caption h2{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:500;
  font-size:24px;
  margin:0 0 12px;
  line-height:1.15;
}

.caption p{
  font-size:14.5px;
  line-height:1.65;
  margin:0 0 auto;
  color:#3A362E;
  white-space:pre-wrap;
}

.plate-date{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:#6B6658;
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid #D9D3C4;
}

.plate-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.icon-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  background:transparent;
  border:1px solid #C9C2AE;
  color:#3A362E;
  padding:6px 12px;
  border-radius:2px;
  cursor:pointer;
}
.icon-btn:hover{border-color:var(--ink);}
.icon-btn.danger{color:var(--rust);border-color:#D8B3A6;}
.icon-btn.danger:hover{border-color:var(--rust);}

.empty{
  border:1px dashed var(--line);
  padding:60px 30px;
  text-align:center;
  color:var(--porcelain-dim);
}
.empty .eyebrow{margin-bottom:14px;}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.6;}

.owner-bar{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:50;
  display:flex;
  gap:10px;
  align-items:center;
}
.owner-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:.06em;
  background:var(--bg-raised);
  border:1px solid var(--line);
  color:var(--porcelain-dim);
  padding:10px 16px;
  border-radius:2px;
  cursor:pointer;
}
.owner-btn.active{color:var(--moss);border-color:var(--moss);}
.owner-btn:hover{border-color:var(--brass);color:var(--brass);}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(10,9,6,.72);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  padding:20px;
}
.modal{
  background:var(--paper);
  color:var(--ink);
  width:100%;
  max-width:420px;
  padding:28px;
  border-radius:2px;
}
.modal h3{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:500;
  font-size:20px;
  margin:0 0 6px;
}
.modal .hint{
  font-size:13px;
  color:#6B6658;
  margin:0 0 20px;
  line-height:1.5;
}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#6B6658;
  margin-bottom:6px;
}
.field input, .field textarea{
  width:100%;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  padding:10px 12px;
  border:1px solid #C9C2AE;
  border-radius:2px;
  background:#fff;
  color:var(--ink);
}
.field textarea{resize:vertical;min-height:90px;font-family:inherit;}
.field input:focus, .field textarea:focus{outline:none;border-color:var(--brass-dim);}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
}
.btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:.05em;
  padding:10px 18px;
  border-radius:2px;
  cursor:pointer;
  border:1px solid var(--ink);
  background:transparent;
  color:var(--ink);
}
.btn.primary{background:var(--ink);color:var(--paper);}
.btn:hover{opacity:.8;}
.modal-error{
  color:var(--rust);
  font-size:12.5px;
  margin:-8px 0 16px;
}

.loading{
  padding:80px 0;
  text-align:center;
  color:var(--porcelain-dim);
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

@media (max-width:720px){
  .plate, .plate.rev{grid-template-columns:1fr;}
  .plate.rev .figure{order:1;}
  .plate.rev .caption{order:2;}
  .top-row{flex-direction:column;}
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Opening the gallery…</div>
</div>

<div class="owner-bar" id="ownerBar"></div>
<div id="modalRoot"></div>

<script>
const META_KEY = 'gallery:meta';
const POSTS_KEY = 'gallery:posts';
const PASS_KEY = 'gallery:owner-pass';

let meta = { title: 'Field Notes', subtitle: 'A running collection of images, and the small stories behind each one.' };
let posts = [];
let isOwner = false;
let passcodeExists = false;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function pad3(n){ return String(n).padStart(3,'0'); }

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

async function loadAll(){
  try{
    const m = await window.storage.get(META_KEY, true);
    if(m && m.value) meta = JSON.parse(m.value);
  }catch(e){}
  try{
    const p = await window.storage.get(POSTS_KEY, true);
    if(p && p.value) posts = JSON.parse(p.value);
  }catch(e){}
  try{
    const pc = await window.storage.get(PASS_KEY, true);
    passcodeExists = !!(pc && pc.value);
  }catch(e){
    passcodeExists = false;
  }
}

async function saveMeta(){
  await window.storage.set(META_KEY, JSON.stringify(meta), true);
}
async function savePosts(){
  await window.storage.set(POSTS_KEY, JSON.stringify(posts), true);
}

function render(){
  const app = document.getElementById('app');
  const ownerBar = document.getElementById('ownerBar');

  let platesHtml = '';
  if(posts.length === 0){
    platesHtml = `
      <div class="empty">
        <div class="eyebrow">Empty wall</div>
        <p>${isOwner ? 'Nothing hung yet. Add your first image to begin the collection.' : 'No plates have been hung yet.'}</p>
        ${isOwner ? '<button class="add-btn" onclick="openPostModal()">+ Add image</button>' : ''}
      </div>`;
  }else{
    platesHtml = posts.map((post, i) => {
      const reversed = i % 2 === 1;
      return `
      <div class="plate ${reversed ? 'rev' : ''}">
        <div class="figure">
          <img src="${esc(post.imageUrl)}" alt="${esc(post.title)}"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'broken',textContent:'Image could not be loaded'}))">
        </div>
        <div class="caption">
          <div class="plate-num">Plate ${pad3(i+1)}</div>
          <h2>${esc(post.title) || 'Untitled'}</h2>
          <p>${esc(post.caption)}</p>
          ${post.date ? `<div class="plate-date">${fmtDate(post.date)}</div>` : ''}
          ${isOwner ? `
          <div class="plate-actions">
            <button class="icon-btn" onclick="openPostModal('${post.id}')">Edit</button>
            <button class="icon-btn danger" onclick="deletePost('${post.id}')">Delete</button>
          </div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  app.innerHTML = `
    <div class="top-row">
      <div>
        <div class="eyebrow">Gallery</div>
        <h1 class="title" id="titleEl" ${isOwner ? 'contenteditable="true"' : ''}>${esc(meta.title)}</h1>
        <p class="subtitle" id="subtitleEl" ${isOwner ? 'contenteditable="true"' : ''}>${esc(meta.subtitle)}</p>
      </div>
      ${isOwner ? '<button class="add-btn" onclick="openPostModal()">+ Add image</button>' : ''}
    </div>
    <div class="plates">${platesHtml}</div>
  `;

  if(isOwner){
    const t = document.getElementById('titleEl');
    const s = document.getElementById('subtitleEl');
    t.addEventListener('blur', async () => {
      meta.title = t.textContent.trim() || 'Field Notes';
      await saveMeta();
    });
    s.addEventListener('blur', async () => {
      meta.subtitle = s.textContent.trim();
      await saveMeta();
    });
  }

  ownerBar.innerHTML = isOwner
    ? `<button class="owner-btn active" onclick="exitOwnerMode()">Editing · Done</button>`
    : `<button class="owner-btn" onclick="promptOwner()">Edit</button>`;
}

function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="ovl">${html}</div>`;
  document.getElementById('ovl').addEventListener('click', (e) => {
    if(e.target.id === 'ovl') closeModal();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function promptOwner(){
  if(!passcodeExists){
    openModal(`
      <div class="modal">
        <h3>Set up editing</h3>
        <p class="hint">You're the only one who should be able to edit this gallery. Choose a passcode — you'll enter it each time you want to make changes. Anyone with the passcode can edit, so keep it private.</p>
        <div id="err"></div>
        <div class="field"><label>New passcode</label><input type="password" id="p1"></div>
        <div class="field"><label>Confirm passcode</label><input type="password" id="p2"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="setupPasscode()">Save passcode</button>
        </div>
      </div>`);
  }else{
    openModal(`
      <div class="modal">
        <h3>Enter passcode</h3>
        <p class="hint">Enter your passcode to edit this gallery.</p>
        <div id="err"></div>
        <div class="field"><label>Passcode</label><input type="password" id="p1" onkeydown="if(event.key==='Enter')checkPasscode()"></div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="checkPasscode()">Unlock</button>
        </div>
      </div>`);
    setTimeout(() => document.getElementById('p1')?.focus(), 50);
  }
}

async function setupPasscode(){
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  const err = document.getElementById('err');
  if(!p1 || p1.length < 4){
    err.innerHTML = '<div class="modal-error">Passcode should be at least 4 characters.</div>';
    return;
  }
  if(p1 !== p2){
    err.innerHTML = "<div class=\"modal-error\">Passcodes don't match.</div>";
    return;
  }
  await window.storage.set(PASS_KEY, p1, true);
  passcodeExists = true;
  isOwner = true;
  closeModal();
  render();
}

async function checkPasscode(){
  const p1 = document.getElementById('p1').value;
  const err = document.getElementById('err');
  try{
    const pc = await window.storage.get(PASS_KEY, true);
    if(pc && pc.value === p1){
      isOwner = true;
      closeModal();
      render();
    }else{
      err.innerHTML = '<div class="modal-error">That passcode is not correct.</div>';
    }
  }catch(e){
    err.innerHTML = '<div class="modal-error">Could not verify passcode. Try again.</div>';
  }
}

function exitOwnerMode(){
  isOwner = false;
  render();
}

function openPostModal(id){
  const editing = !!id;
  const post = editing ? posts.find(p => p.id === id) : null;
  const today = new Date().toISOString().slice(0,10);
  openModal(`
    <div class="modal">
      <h3>${editing ? 'Edit plate' : 'Add image'}</h3>
      <p class="hint">Paste a link to an image hosted elsewhere on the web, add a title, and write the text you want beside it.</p>
      <div id="err"></div>
      <div class="field"><label>Image URL</label><input type="text" id="fUrl" placeholder="https://…" value="${post ? esc(post.imageUrl) : ''}"></div>
      <div class="field"><label>Title</label><input type="text" id="fTitle" placeholder="Give it a title" value="${post ? esc(post.title) : ''}"></div>
      <div class="field"><label>Caption</label><textarea id="fCaption" placeholder="What's the story here?">${post ? esc(post.caption) : ''}</textarea></div>
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${post ? esc(post.date || today) : today}"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="savePost(${editing ? `'${id}'` : 'null'})">${editing ? 'Save changes' : 'Add to gallery'}</button>
      </div>
    </div>`);
}

async function savePost(id){
  const url = document.getElementById('fUrl').value.trim();
  const title = document.getElementById('fTitle').value.trim();
  const caption = document.getElementById('fCaption').value.trim();
  const date = document.getElementById('fDate').value;
  const err = document.getElementById('err');

  if(!url){
    err.innerHTML = '<div class="modal-error">An image URL is required.</div>';
    return;
  }

  if(id){
    const post = posts.find(p => p.id === id);
    post.imageUrl = url;
    post.title = title;
    post.caption = caption;
    post.date = date;
  }else{
    posts.push({
      id: 'p' + Date.now() + Math.random().toString(36).slice(2,7),
      imageUrl: url,
      title, caption, date
    });
  }
  await savePosts();
  closeModal();
  render();
}

async function deletePost(id){
  openModal(`
    <div class="modal">
      <h3>Delete this plate?</h3>
      <p class="hint">This removes the image and text from the gallery for everyone. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" style="background:var(--rust);border-color:var(--rust)" onclick="confirmDelete('${id}')">Delete</button>
      </div>
    </div>`);
}

async function confirmDelete(id){
  posts = posts.filter(p => p.id !== id);
  await savePosts();
  closeModal();
  render();
}

window.openPostModal = openPostModal;
window.savePost = savePost;
window.deletePost = deletePost;
window.confirmDelete = confirmDelete;
window.promptOwner = promptOwner;
window.setupPasscode = setupPasscode;
window.checkPasscode = checkPasscode;
window.exitOwnerMode = exitOwnerMode;
window.closeModal = closeModal;

(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
